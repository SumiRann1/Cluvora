<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="100%" stop-color="#00d9f5"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="200" height="200" rx="40" fill="#060913"/>
  <rect x="2" y="2" width="196" height="196" rx="38" fill="none" stroke="url(#cyberGrad)" stroke-width="1.5" opacity="0.4"/>

  <!-- Circuit traces -->
  <path d="M 30 50 L 55 50 L 70 35 M 170 50 L 145 50 L 130 35 M 35 150 L 55 150 M 165 150 L 145 150" stroke="#00f5a0" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  <circle cx="70" cy="35" r="2.5" fill="#00d9f5" opacity="0.6"/>
  <circle cx="130" cy="35" r="2.5" fill="#00d9f5" opacity="0.6"/>

  <!-- Cybersecurity Shield -->
  <path d="M 100 35 L 148 56 C 148 102 124 135 100 148 C 76 135 52 102 52 56 Z" fill="url(#shieldGrad)" stroke="url(#cyberGrad)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Spectre Hood / Ghost Mask -->
  <!-- Outer cowl -->
  <path d="M 100 55 C 80 55 72 72 72 90 C 72 108 85 116 100 128 C 115 116 128 108 128 90 C 128 72 120 55 100 55 Z" fill="#0b1220" stroke="url(#cyberGrad)" stroke-width="1.8"/>

  <!-- Glowing Cyber Eyes / Terminal Visor -->
  <path d="M 83 88 L 94 92 L 87 96 Z" fill="#00f5a0"/>
  <path d="M 117 88 L 106 92 L 113 96 Z" fill="#00d9f5"/>
  <line x1="97" y1="106" x2="103" y2="106" stroke="#00f5a0" stroke-width="2" stroke-linecap="round"/>

  <!-- Terminal "0x" badge -->
  <rect x="86" y="65" width="28" height="12" rx="3" fill="#030712" stroke="#00d9f5" stroke-width="1" opacity="0.8"/>
  <text x="100" y="74" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#00f5a0" text-anchor="middle">0x</text>

  <!-- Club Name -->
  <text x="100" y="172" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" text-anchor="middle" fill="#f0fdf4" letter-spacing="4">SPECTRE</text>
  <text x="100" y="186" font-family="'Courier New', monospace" font-size="8" text-anchor="middle" fill="#00d9f5" letter-spacing="2">CYBERSECURITY</text>
</svg>